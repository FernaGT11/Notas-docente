<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Escala de Notas para Docentes</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --border: #e2e8f0;
            --success: #10b981;
            --danger: #ef4444;
            --radius: 12px;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body { overflow-x: hidden; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            padding: 24px;
            min-height: 100vh;
        }

        header {
            max-width: 1400px;
            margin: 0 auto 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        header h1 { font-size: 1.75rem; font-weight: 700; color: var(--primary); line-height: 1.2; }
        header p { color: var(--text-light); font-size: 0.95rem; }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            white-space: nowrap;
        }

        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); }
        .btn-primary:active { transform: translateY(0); }

        .btn-secondary {
            background: white;
            color: var(--primary);
            border: 1.5px solid var(--primary);
        }
        .btn-secondary:hover { background: #eff6ff; transform: translateY(-1px); }
        .btn-secondary:active { transform: translateY(0); }

        .btn-danger {
            background: transparent;
            color: var(--danger);
            border: 1px solid var(--danger);
            padding: 6px 12px;
            font-size: 0.85rem;
        }
        .btn-danger:hover { background: var(--danger); color: white; }

        #blocks-container {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(640px, 1fr));
            gap: 24px;
        }

        .block {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 24px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 20px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .block-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
            gap: 12px;
        }

        .block-header h2 { font-size: 1.15rem; font-weight: 600; }

        .params-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 12px;
        }

        .param-group { display: flex; flex-direction: column; gap: 4px; }

        .param-group label {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .param-group input {
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 1rem;
            font-family: inherit;
            transition: border-color 0.2s;
            width: 100%;
        }

        .param-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgb(37 99 235 / 0.1);
        }

        .actions { display: flex; gap: 12px; flex-wrap: wrap; }

        .section-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .grades-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(58px, 1fr));
            gap: 5px;
        }

        .grade-cell {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 5px 3px;
            border-radius: 7px;
            background: #f1f5f9;
            border: 1px solid transparent;
            transition: transform 0.15s, border-color 0.15s;
        }

        .grade-cell:hover {
            transform: translateY(-2px);
            border-color: var(--primary);
        }

        .grade-cell .p {
            font-size: 0.68rem;
            color: var(--text-light);
            font-weight: 600;
            line-height: 1.1;
        }

        .grade-cell .p::before { content: "P "; opacity: 0.6; }

        .grade-cell .n {
            font-size: 0.95rem;
            font-weight: 700;
            line-height: 1.15;
            color: var(--danger);
        }

        .grade-cell.aprobado { background: #ecfdf5; border-color: #d1fae5; }
        .grade-cell.aprobado .n { color: var(--success); }

        .grade-cell.reprobado { background: #fef2f2; border-color: #fee2e2; }
        .grade-cell.reprobado .n { color: var(--danger); }

        .chart-container {
            position: relative;
            height: 280px;
            width: 100%;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-light);
            grid-column: 1 / -1;
        }
        .empty-state svg { width: 64px; height: 64px; margin-bottom: 16px; opacity: 0.4; }

        /* ===================== TABLET ===================== */
        @media (max-width: 1024px) {
            body { padding: 20px; }
            #blocks-container { grid-template-columns: 1fr; }
        }

        /* ===================== MÓVIL ===================== */
        @media (max-width: 640px) {
            body { padding: 14px; }

            header {
                flex-direction: column;
                align-items: stretch;
                gap: 14px;
                margin-bottom: 20px;
                text-align: center;
            }
            header h1 { font-size: 1.35rem; }
            header p { font-size: 0.85rem; }

            header .btn-primary { width: 100%; padding: 12px; }

            .block { padding: 16px; gap: 16px; border-radius: 10px; }

            .block-header h2 { font-size: 1rem; }

            .params-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }

            .param-group input { padding: 10px; font-size: 0.95rem; }

            .actions { flex-direction: column; }
            .actions .btn { width: 100%; padding: 12px; }

            .section-title { font-size: 0.75rem; }

            .grades-grid {
                grid-template-columns: repeat(auto-fill, minmax(52px, 1fr));
                gap: 4px;
            }

            .grade-cell { padding: 4px 2px; border-radius: 6px; }
            .grade-cell .p { font-size: 0.62rem; }
            .grade-cell .n { font-size: 0.88rem; }

            .chart-container { height: 230px; }
        }

        @media (max-width: 360px) {
            .params-grid { grid-template-columns: 1fr; }
            .grades-grid { grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); }
        }
    </style>
</head>
<body>

<header>
    <div>
        <h1>📊 Escala de Notas para Docentes</h1>
        <p>Calcula notas, revisa la tabla completa y descarga el PDF</p>
    </div>
    <button class="btn btn-primary" onclick="addBlock()">➕ Agregar Evaluación</button>
</header>

<div id="blocks-container">
    <div class="empty-state" id="empty-state">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 17V7m0 10a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h2a2 2 0 012 2m0 10a2 2 0 002 2h2a2 2 0 002-2M9 7a2 2 0 012-2h2a2 2 0 012 2m0 10V7m0 10a2 2 0 002 2h2a2 2 0 002-2V7a2 2 0 00-2-2h-2a2 2 0 00-2 2" />
        </svg>
        <p>No hay evaluaciones. Haz clic en "Agregar Evaluación" para comenzar.</p>
    </div>
</div>

<template id="block-template">
    <div class="block">
        <div class="block-header">
            <h2>📝 Evaluación <span class="block-number"></span></h2>
            <button class="btn btn-danger" onclick="removeBlock(this)">Eliminar</button>
        </div>

        <div class="params-grid">
            <div class="param-group">
                <label>Nota mínima</label>
                <input type="number" class="p-nmin" value="1.0" step="0.1" min="1" max="6" inputmode="decimal">
            </div>
            <div class="param-group">
                <label>Nota máxima</label>
                <input type="number" class="p-nmax" value="7.0" step="0.1" min="2" max="7" inputmode="decimal">
            </div>
            <div class="param-group">
                <label>Nota aprobación</label>
                <input type="number" class="p-napr" value="4.0" step="0.1" min="1" max="6" inputmode="decimal">
            </div>
            <div class="param-group">
                <label>Exigencia (%)</label>
                <input type="number" class="p-exig" value="60" step="1" min="1" max="100" inputmode="numeric">
            </div>
            <div class="param-group">
                <label>Puntaje máximo</label>
                <input type="number" class="p-pmax" value="100" step="1" min="1" inputmode="numeric">
            </div>
        </div>

        <div class="actions">
            <button class="btn btn-primary" onclick="calculateBlock(this)">🔄 Calcular y Graficar</button>
            <button class="btn btn-secondary" onclick="downloadPDF(this)">📄 Descargar PDF</button>
        </div>

        <div>
            <div class="section-title">Tabla de notas · P = Puntaje / N = Nota</div>
            <div class="grades-grid"></div>
        </div>

        <div>
            <div class="section-title">Curva de conversión</div>
            <div class="chart-container">
                <canvas></canvas>
            </div>
        </div>
    </div>
</template>

<script>
    let blockCounter = 0;

    function addBlock() {
        const container = document.getElementById('blocks-container');
        const emptyState = document.getElementById('empty-state');
        if (emptyState) emptyState.remove();

        blockCounter++;
        const template = document.getElementById('block-template');
        const clone = template.content.cloneNode(true);

        const block = clone.querySelector('.block');
        block.dataset.id = blockCounter;
        block.querySelector('.block-number').textContent = `#${blockCounter}`;

        container.appendChild(clone);

        const newBlock = container.lastElementChild;
        calculateBlock(newBlock.querySelector('.btn-primary'));
    }

    function removeBlock(btn) {
        const block = btn.closest('.block');
        block.remove();

        const container = document.getElementById('blocks-container');
        if (container.querySelectorAll('.block').length === 0) {
            container.innerHTML = `
                <div class="empty-state" id="empty-state">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 17V7m0 10a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h2a2 2 0 012 2m0 10a2 2 0 002 2h2a2 2 0 002-2M9 7a2 2 0 012-2h2a2 2 0 012 2m0 10V7m0 10a2 2 0 002 2h2a2 2 0 002-2V7a2 2 0 00-2-2h-2a2 2 0 00-2 2" />
                    </svg>
                    <p>No hay evaluaciones. Haz clic en "Agregar Evaluación" para comenzar.</p>
                </div>
            `;
        }
    }

    function roundChilean(value) {
        const truncated = Math.floor(value * 100) / 100;
        const cents = Math.round((truncated - Math.floor(truncated)) * 100);
        const tenths = Math.floor(truncated * 10) / 10;
        if (cents >= 5) return Math.round((tenths + 0.1) * 10) / 10;
        return Math.round(tenths * 10) / 10;
    }

    function calculateGrade(p, nmin, nmax, napr, exig, pmax) {
        // Guarda: 0 puntos (o menos) siempre equivale exactamente a la nota mínima
        if (p <= 0) return nmin;

        const e = exig / 100;
        const threshold = e * pmax;
        let nota;
        if (p < threshold) {
            nota = (napr - nmin) * (p / threshold) + nmin;
        } else {
            nota = (nmax - napr) * ((p - threshold) / (pmax * (1 - e))) + napr;
        }
        return Math.min(nmax, Math.max(nmin, roundChilean(nota)));
    }

    function readParams(block) {
        return {
            nmin: parseFloat(block.querySelector('.p-nmin').value),
            nmax: parseFloat(block.querySelector('.p-nmax').value),
            napr: parseFloat(block.querySelector('.p-napr').value),
            exig: parseFloat(block.querySelector('.p-exig').value),
            pmax: parseInt(block.querySelector('.p-pmax').value)
        };
    }

    function buildGrades(nmin, nmax, napr, exig, pmax) {
        const cells = [];
        const step = pmax <= 100 ? 1 : Math.ceil(pmax / 100);
        for (let p = 0; p <= pmax; p += step) {
            cells.push({ p, nota: calculateGrade(p, nmin, nmax, napr, exig, pmax) });
        }
        if (cells[cells.length - 1].p !== pmax) {
            cells.push({ p: pmax, nota: calculateGrade(pmax, nmin, nmax, napr, exig, pmax) });
        }
        return cells;
    }

    function calculateBlock(btn) {
        const block = btn.closest('.block');
        const { nmin, nmax, napr, exig, pmax } = readParams(block);
        if (!pmax || pmax < 1) return;

        const cells = buildGrades(nmin, nmax, napr, exig, pmax);
        const gradesGrid = block.querySelector('.grades-grid');
        gradesGrid.innerHTML = '';

        cells.forEach(c => {
            const cell = document.createElement('div');
            cell.className = 'grade-cell ' + (c.nota >= napr ? 'aprobado' : 'reprobado');
            cell.innerHTML = `<span class="p">${c.p}</span><span class="n">${c.nota.toFixed(1)}</span>`;
            cell.title = `Puntaje ${c.p} → Nota ${c.nota.toFixed(1)}`;
            gradesGrid.appendChild(cell);
        });

        drawChart(block, cells, nmin, nmax, napr);
    }

    function drawChart(block, cells, nmin, nmax, napr) {
        const canvas = block.querySelector('canvas');
        const ctx = canvas.getContext('2d');
        if (block._chart) block._chart.destroy();

        const labels = cells.map(c => c.p);
        const grades = cells.map(c => c.nota);

        block._chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Nota',
                    data: grades,
                    borderColor: '#2563eb',
                    backgroundColor: 'rgba(37, 99, 235, 0.08)',
                    borderWidth: 2.5,
                    pointRadius: labels.length > 50 ? 0 : 3,
                    pointHoverRadius: 5,
                    fill: true,
                    tension: 0.1
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: false,
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        callbacks: {
                            title: (items) => `Puntaje: ${items[0].label}`,
                            label: (item) => `Nota: ${item.parsed.y.toFixed(1)}`
                        }
                    }
                },
                scales: {
                    x: {
                        title: { display: true, text: 'Puntaje', font: { size: 11 } },
                        grid: { display: false }
                    },
                    y: {
                        min: nmin,
                        max: nmax,
                        title: { display: true, text: 'Nota', font: { size: 11 } },
                        ticks: { stepSize: 0.5 },
                        grid: { color: 'rgba(0,0,0,0.05)' }
                    }
                }
            }
        });
    }

    // ========== PDF ==========
    function getChartImageWithWhiteBg(canvas) {
        const temp = document.createElement('canvas');
        temp.width = canvas.width;
        temp.height = canvas.height;
        const ctx = temp.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, temp.width, temp.height);
        ctx.drawImage(canvas, 0, 0);
        return temp.toDataURL('image/png');
    }

    function downloadPDF(btn) {
        const block = btn.closest('.block');
        const { nmin, nmax, napr, exig, pmax } = readParams(block);
        if (!pmax || pmax < 1) { alert('Configura un puntaje máximo válido.'); return; }
        if (!window.jspdf || !window.jspdf.jsPDF) { alert('No se pudo cargar la librería PDF.'); return; }

        // Asegura que exista gráfico
        if (!block._chart) calculateBlock(block.querySelector('.btn-primary'));

        const { jsPDF } = window.jspdf;
        const doc = new jsPDF('p', 'mm', 'a4');
        const pageW = 210, pageH = 297;
        const margin = 15;
        const contentW = pageW - margin * 2;
        const blockNum = block.dataset.id;

        // ---- Cabecera azul ----
        doc.setFillColor(37, 99, 235);
        doc.rect(0, 0, pageW, 34, 'F');

        doc.setFont('helvetica', 'bold');
        doc.setFontSize(20);
        doc.setTextColor(255, 255, 255);
        doc.text('Escala de Notas', pageW / 2, 16, { align: 'center' });

        doc.setFont('helvetica', 'normal');
        doc.setFontSize(10);
        doc.text(`Evaluación #${blockNum}  ·  Generado el ${new Date().toLocaleDateString('es-CL')}`, pageW / 2, 25, { align: 'center' });

        // ---- Título parámetros ----
        let y = 48;
        doc.setTextColor(30, 41, 59);
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(11);
        doc.text('Parámetros de entrada', margin, y);
        y += 7;

        // ---- Tarjetas de parámetros ----
        const params = [
            { label: 'NOTA MÍNIMA', value: nmin.toFixed(1) },
            { label: 'NOTA MÁXIMA', value: nmax.toFixed(1) },
            { label: 'APROBACIÓN', value: napr.toFixed(1) },
            { label: 'EXIGENCIA', value: exig.toFixed(0) + '%' },
            { label: 'P. MÁXIMO', value: String(pmax) }
        ];
        const gap = 3;
        const boxW = (contentW - gap * (params.length - 1)) / params.length;
        const boxH = 17;

        params.forEach((p, i) => {
            const x = margin + i * (boxW + gap);
            doc.setFillColor(248, 250, 252);
            doc.setDrawColor(226, 232, 240);
            doc.roundedRect(x, y, boxW, boxH, 2, 2, 'FD');

            doc.setFontSize(6.5);
            doc.setTextColor(100, 116, 139);
            doc.setFont('helvetica', 'bold');
            doc.text(p.label, x + boxW / 2, y + 6, { align: 'center' });

            doc.setFontSize(12);
            doc.setTextColor(30, 41, 59);
            doc.text(p.value, x + boxW / 2, y + 13.5, { align: 'center' });
        });

        y += boxH + 12;

        // ---- Título tabla ----
        doc.setFontSize(11);
        doc.setTextColor(30, 41, 59);
        doc.setFont('helvetica', 'bold');
        doc.text('Tabla de notas', margin, y);
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(8);
        doc.setTextColor(100, 116, 139);
        doc.text('P = Puntaje  ·  N = Nota', margin + 32, y);
        y += 5;

        // ---- Generar celdas de notas ----
        const cells = buildGrades(nmin, nmax, napr, exig, pmax);

        const cellW = 12;
        const cellH = 11;
        const cols = Math.floor(contentW / cellW);
        const gridStartY = y;

        cells.forEach((c, i) => {
            const col = i % cols;
            const row = Math.floor(i / cols);
            const x = margin + col * cellW;
            const cy = gridStartY + row * cellH;

            if (c.nota >= napr) {
                doc.setFillColor(236, 253, 245);
                doc.setDrawColor(167, 243, 208);
            } else {
                doc.setFillColor(254, 242, 242);
                doc.setDrawColor(254, 202, 202);
            }
            doc.rect(x, cy, cellW - 0.6, cellH - 0.6, 'FD');

            doc.setFontSize(5.5);
            doc.setTextColor(100, 116, 139);
            doc.setFont('helvetica', 'normal');
            doc.text('P' + c.p, x + (cellW - 0.6) / 2, cy + 4, { align: 'center' });

            doc.setFontSize(9);
            doc.setFont('helvetica', 'bold');
            if (c.nota >= napr) doc.setTextColor(16, 185, 129);
            else doc.setTextColor(239, 68, 68);
            doc.text(c.nota.toFixed(1), x + (cellW - 0.6) / 2, cy + 9.2, { align: 'center' });
        });

        const rows = Math.ceil(cells.length / cols);
        y = gridStartY + rows * cellH + 12;

        // ---- Salto de página si es necesario ----
        if (y > 215) {
            doc.addPage();
            y = 20;
        }

        // ---- Título gráfico ----
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(11);
        doc.setTextColor(30, 41, 59);
        doc.text('Curva de conversión', margin, y);
        y += 5;

        // ---- Imagen del gráfico ----
        const canvas = block.querySelector('canvas');
        const chartImg = getChartImageWithWhiteBg(canvas);
        const aspect = canvas.width / canvas.height;
        const chartW = contentW;
        const chartH = Math.min(chartW / aspect, 90);

        doc.addImage(chartImg, 'PNG', margin, y, chartW, chartH);

        // ---- Pie de página ----
        doc.setFontSize(7.5);
        doc.setTextColor(148, 163, 184);
        doc.setFont('helvetica', 'normal');
        doc.text('Generado con Escala de Notas para Docentes', pageW / 2, pageH - 8, { align: 'center' });

        doc.save(`escala-notas-eval-${blockNum}.pdf`);
    }
</script>

</body>
</html>
